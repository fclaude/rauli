name: Flake trace
on:
  push:
    branches: [flake-trace]
permissions:
  contents: read
jobs:
  trace:
    runs-on: macos-15
    timeout-minutes: 25
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Run the flaky test many times
        run: go test ./internal/chrome/ -run 'TestTypeAndSubmitAForm' -count=60 -v 2>&1 | grep -v '^=== ' | tail -80
