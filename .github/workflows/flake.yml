name: Flake trace
on:
  push:
    branches: [flake-trace]
permissions:
  contents: read
jobs:
  trace:
    runs-on: macos-15
    timeout-minutes: 40
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Run the whole suite several times
        run: |
          for i in 1 2 3 4 5 6; do
            echo "=== round $i"
            go test ./... -count=1 2>&1 | grep -E -A14 -- '--- FAIL|^FAIL' | head -60 || true
          done
