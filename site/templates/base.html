<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>{% block title %}{{ config.title }}{% endblock title %}</title>
  <meta name="description" content="{{ config.description }}">
  <link rel="stylesheet" href="{{ get_url(path='style.css', cachebust=true) }}">
  <script defer src="https://analytics.recoded.cl/script.js" data-website-id="f0c34d21-7676-47eb-b81b-459c45501843"></script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to the content</a>
  <header class="site-header">
    <a class="site-title" href="{{ get_url(path='@/_index.md') }}">{{ config.title }}</a>
    <nav aria-label="Main">
      <ul>
        {% set root = get_section(path="_index.md") -%}
        <li><a href="{{ root.permalink }}"{% if current_url == root.permalink %} aria-current="page"{% endif %}>{{ root.extra.nav }}</a></li>
        {% for p in root.pages -%}
        <li><a href="{{ p.permalink }}"{% if current_url == p.permalink %} aria-current="page"{% endif %}>{{ p.extra.nav }}</a></li>
        {% endfor -%}
        <li><a href="{{ config.extra.repo }}">Source on GitHub</a></li>
      </ul>
    </nav>
  </header>
  <main id="main" tabindex="-1">
    {% block content %}{% endblock content %}
  </main>
  <footer class="site-footer">
    <p><a href="{{ config.extra.repo }}">{{ config.extra.repo }}</a>, MIT licence.</p>
  </footer>
</body>
</html>
